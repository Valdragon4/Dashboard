{# Bouton. libelle, icone (option), variante = principal|secondaire|discret|danger (défaut secondaire), petit (bool), type (défaut button), href (option : rendu en <a>). #}{% if href %}<a class="btn btn-{{ variante|default:"secondaire" }}{% if petit %} btn-petit{% endif %}" href="{{ href }}">{% if icone %}{% include "graphite/icone.html" with nom=icone only %}{% endif %}{{ libelle }}</a>{% else %}<button type="{{ type|default:"button" }}" class="btn btn-{{ variante|default:"secondaire" }}{% if petit %} btn-petit{% endif %}">{% if icone %}{% include "graphite/icone.html" with nom=icone only %}{% endif %}{{ libelle }}</button>{% endif %}
